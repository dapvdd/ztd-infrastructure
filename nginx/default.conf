# HTTP: ACME challenges + redirect to HTTPS (F-06).
# Admin bearer tokens and dashboard session cookies must never travel over
# plaintext HTTP; everything else 301s to the TLS listener.
server {
    listen       80;
    server_name  _;

    # ACME HTTP-01 challenge path stays on HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# TLS termination for all dashboard/API/MQTT-WS traffic.
server {
    listen       443 ssl;
    http2       on;
    server_name  _;

    # Cert paths are env-overridable at container start via envsubst in the
    # entrypoint; defaults match the mounted nginx-certs volume.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: only safe once the deployment is HTTPS-only end to end.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Admin-only: bootstrap returns a script containing Wi-Fi credentials.
    location ^~ /api/v1/bootstrap/ {
        auth_basic           "ZTD Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://ztd-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ZTD backend API (FastAPI on ztd-backend:8000, same docker network).
    # GET/HEAD/OPTIONS terbuka untuk dashboard monitoring; method yang mengubah data wajib login.
    location /api/ {
        limit_except GET HEAD OPTIONS {
            auth_basic           "ZTD Admin";
            auth_basic_user_file /etc/nginx/.htpasswd;
        }

        proxy_pass http://ztd-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Dashboard BFF session boundary (F-04/F-05): the browser talks only to
    # this prefix. The provisioning admin bearer is injected server-side by
    # the backend; it must never appear in browser JS or responses. Session
    # cookie (HttpOnly) flows through the proxied request. No basic auth here:
    # the BFF performs htpasswd validation itself at POST /session.
    location ^~ /api/dashboard/ {
        client_max_body_size 16k;
        proxy_pass http://ztd-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        add_header Cache-Control "no-store" always;
    }

    # Health check endpoint
    location = /health {
        proxy_pass http://ztd-backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API docs (preserved from 6fed070)
    location /docs {
        proxy_pass http://ztd-backend:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://ztd-backend:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # MQTT over WebSocket (preserved from 6fed070)
    location /mqtt {
        proxy_pass http://ztd-mqtt:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Leftover backup / editor files must never be served (e.g. index.html.bak).
    location ~* \.(bak|backup|old|orig|save|swp|swo|tmp)$ {
        return 404;
    }

    # SPA static frontend
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }
}
