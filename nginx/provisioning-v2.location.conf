# Candidate include INSIDE the TLS-enabled server block, after deployment review.
# Do not put the admin bearer credential in a public Vite bundle.
# Provisioning performs per-device / admin / Monitoring authentication itself.
location ^~ /api/v2/provisioning/ {
    client_max_body_size 16k;
    proxy_pass http://ztd-backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
}
