# ZTD MQTT broker (F-07: authenticated, ACL-authorized).
#
# Listeners:
#   1883 — plain MQTT, container-internal only (backend + gateway agents via
#          Tailscale). Not published to 0.0.0.0 in docker-compose.
#   9001 — WebSocket for the web dashboard, reachable via the nginx /mqtt
#          location on the internal network, not published to the host.
#
# ESP compatibility note: ESP nodes publish to the GATEWAY's own Mosquitto on
# the Raspberry Pi (hardcoded secrets.h at flash time), never to this VPS
# broker. Securing this broker does not change ESP firmware requirements.

# Standard MQTT for Raspberry Pi devices
listener 1883
protocol mqtt

# WebSocket listener for the web dashboard
listener 9001
protocol websockets

# --- Authentication (F-07) --------------------------------------------------
# Password file generated out-of-band by the operator:
#   docker run --rm -it eclipse-mosquitto:2 mosquitto_passwd -c /tmp/passwd <user>
# See mosquitto/README-mqtt-auth.md for the full runbook (users, ACLs, ESP
# gateway-side notes). The file is mounted read-only at /mosquitto/config/passwd.
#
# mosquitto 2.x refuses to start (or silently fails auth) unless the passwd
# file is owned by the `mosquitto` user with mode 0600/0640 — world-readable
# files are rejected. The broker runs as UID 1883 inside the container; from
# the host: chown 1883:1883 mosquitto/passwd && chmod 600 mosquitto/passwd.
# This file (and mosquitto/acl) must keep LF line endings: mosquitto parses
# CRLF values literally ("false\r" is not "false"); .gitattributes enforces it.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Persistence settings
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
