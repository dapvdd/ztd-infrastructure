services:
  ztd-db:
    image: postgres:16
    container_name: ztd-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - ztd-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ztd-nginx:
    image: nginx:latest
    container_name: ztd-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # location snippets must NOT live in conf.d/ (nginx parses every
      # conf.d/*.conf at http level, where `location` is illegal). They are
      # mounted under snippets/ and included from inside the TLS server block.
      - ./nginx/provisioning-v2.location.conf:/etc/nginx/snippets/provisioning-v2.location.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ../ztd-dashboard/dist:/usr/share/nginx/html:ro
      # TLS certificates (fullchain.pem, privkey.pem) — provisioned out-of-band
      # by scripts/harden-nginx.sh or an ACME flow; see F-06 remediation notes.
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - ztd-network
    healthcheck:
      test: ["CMD-SHELL", "curl -skf https://localhost/ || curl -f http://localhost/.well-known/acme-challenge/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ztd-backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: ztd-backend:latest
    container_name: ztd-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ztd-stage-db
      MQTT_HOST: ztd-stage-mqtt
    ports:
      - "127.0.0.1:${API_PORT:-18000}:8000"
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/agent:/app/agent:ro
    networks:
      - ztd-network
    depends_on:
      ztd-db:
        condition: service_healthy
      ztd-mqtt:
        condition: service_started

  ztd-mqtt:
    image: eclipse-mosquitto:2
    container_name: ztd-mqtt
    restart: unless-stopped
    # F-07: no broker ports published to the host. Backend and gateway agents
    # reach 1883 over the internal network / Tailscale; the dashboard consumes
    # MQTT-WS only through the nginx /mqtt location. LAN exposure is a
    # deliberate, documented operator decision (see mosquitto/README-mqtt-auth.md).
    expose:
      - "1883"
      - "9001"
    # Credentials for the authenticated healthcheck; injected from the
    # operator's .env (never committed). Healthcheck passes -u/-P from these.
    environment:
      MQTT_HEALTH_USER: ${MQTT_HEALTH_USER}
      MQTT_HEALTH_PASS: ${MQTT_HEALTH_PASS}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      # Operator-generated (never committed): docker … mosquitto_passwd -c …
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - ztd-network
    healthcheck:
      # Anonymous is disabled; the healthcheck must authenticate. exit 0 is
      # intentional ONLY as "broker answered"; -P wrong creds must fail, so we
      # check the exit status of an authenticated sub instead of swallowing it.
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -u $$MQTT_HEALTH_USER -P $$MQTT_HEALTH_PASS"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:

networks:
  ztd-network:
    driver: bridge
